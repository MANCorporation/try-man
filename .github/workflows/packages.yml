# Builds the standalone packages:
#   macOS  .dmg  (Apple Silicon and Intel)
#   Linux  .AppImage (x86_64 and arm64)
#   Windows setup .exe + portable .zip
# Pushing a tag like "v10" also publishes them as a GitHub release.
name: Packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        # The app runs on this macOS version and newer, so use old runners.
        runner: [macos-14, macos-15-intel]   # Apple Silicon, Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install gtk4 libadwaita adwaita-icon-theme librsvg qemu
      - run: packaging/macos/build-app.sh
        env:
          # Optional: set these secrets to sign with your Apple Developer ID.
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.runner }}
          path: dist/*.dmg

  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo packaging/linux/build-appimage.sh --install-deps
      - run: packaging/linux/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.runner }}
          path: dist/*.AppImage

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
      - run: packaging/windows/build-windows.sh --install-deps
      - run: packaging/windows/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
