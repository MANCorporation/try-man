[package]
name = "try-man"
version = "10.0.0"
edition = "2021"
description = "Try the MAN Linux distribution in a virtual machine"
license = "GPL-3.0-or-later"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
ureq = "3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_SystemInformation"] }

[profile.release]
opt-level = 3
lto = "thin"
